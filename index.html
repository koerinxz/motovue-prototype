<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoVue — Prototype MVR-0</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a4439'/%3E%3Cpath d='M6 23V9l10 10L26 9v14' fill='none' stroke='%23c6f36b' stroke-width='3'/%3E%3C/svg%3E"><style>:root{font:16px Arial,sans-serif;color:#17372e;background:#e9efeb}*{box-sizing:border-box}body{margin:0;display:flex;justify-content:center;gap:7vw;padding:40px 24px}aside{max-width:360px;padding-top:70px}.brand{font-size:34px}aside h1{font-size:48px;line-height:1.1;letter-spacing:-2px;margin-top:70px}aside p{line-height:1.7;color:#536c62}.meta{margin-top:90px;font-size:13px;letter-spacing:1px}main{width:440px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #123c241a}header{padding:20px 24px;display:flex;align-items:center;justify-content:space-between}header b{font-size:22px}.ribbon{padding:10px 24px;background:#d7eaa9;font-size:12px;letter-spacing:1px;font-weight:bold}article{padding:24px;min-height:550px}h2{font-size:28px;letter-spacing:-1px;margin:10px 0 16px}h3{font-size:18px}p{line-height:1.55}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#607568}.muted{color:#607568;font-size:14px}.card{border:1px solid #dce5de;padding:18px;border-radius:16px;margin:16px 0}.hero{background:#0a4439;color:#fff;border:0}.hero p{color:#dbebdd}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e8eee9}.pill{font-size:14px;border-radius:7px;padding:5px 8px;background:#eff3ed}.notice{padding:14px;background:#fff0d6;border-radius:12px;font-size:14px;line-height:1.6}button{cursor:pointer;width:100%;padding:15px;border:0;background:#0a4439;color:white;border-radius:11px;font:700 16px Arial;margin:6px 0}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79a94e;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf3ed;color:#234f3e}.danger{background:#a33627}.small{width:auto;padding:9px 12px;font-size:14px}label{display:block;line-height:1.5;margin:14px 0}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:13px;border:1px solid #bccfc4;border-radius:9px;font:inherit;margin-top:6px}input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin-right:7px}.map{background:#e5eee5;border-radius:16px;overflow:hidden;margin:16px 0}.map svg{display:block;width:100%}.map figcaption{font-size:12px;padding:10px;color:#546e5d}.metric{font-size:32px;font-weight:700}.back{width:auto;padding:0;margin:0 0 18px;background:none;color:#345b48;font-size:14px}footer{padding:20px 24px;font-size:12px;color:#6e7e73;line-height:1.6;border-top:1px solid #e9eee9}@media(max-width:800px){body{padding:0}aside{display:none}main{width:100%;max-width:480px;min-height:100vh;border-radius:0;box-shadow:none}}
</style></head><body><aside><b class="brand">MotoVue.</b><h1>See the ride.<br>Own the journey.</h1><p>Koordinasi touring dalam satu pandangan.</p><p class="meta">MVR-0 / INTERACTIVE PROTOTYPE<br>Rider · Leader · Sweeper</p></aside><main><header><b>MotoVue</b><button class="small secondary" data-a="reset">Ulang sesi</button></header><div class="ribbon">SIMULASI · gunakan saat berhenti</div><article id="app"></article><footer>Semua data fiktif. Tidak ada lokasi live, pesan eksternal, atau layanan darurat.</footer></main><script>const root=document.getElementById('app');
const init=()=>({page:'home',role:'Rider',joined:false,read:false,sharing:'Not sharing',health:'Watch',tour:'Weekend Puncak Loop',brief:'Berhenti di titik regroup yang disepakati. Periksa anggota grup sebelum berangkat.',date:'2026-09-20T06:00',start:'Titik kumpul demo',point:'Rest Area Cisarua',ack:false,sos:'',person:'Ardi',route:false,names:false});let s=init();
const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(t,a,css='')=>`<button class="${css}" data-a="${a}">${t}</button>`;const back=(p='tour')=>b('← Kembali',`go:${p}`,'back');const h=(a,t)=>`<div class="eyebrow">${a}</div><h2>${t}</h2>`;
const riders=[['Ardi','Fresh','10 detik lalu'],['Nia','Fresh','20 detik lalu'],['Bima','Aging','2 menit lalu'],['Raka','Stale','12 menit lalu'],['Sari','Unavailable','Belum ada posisi']];
function map(){return `<figure class="map"><svg viewBox="0 0 360 230" role="img" aria-label="Diagram demo: Ardi dan Nia di depan, Bima di tengah, posisi terakhir Raka di belakang"><path d="M-20 185Q70 240 135 145T290 65T380 20" stroke="#bccdbd" stroke-width="36" fill="none"/><path d="M-20 185Q70 240 135 145T290 65T380 20" stroke="white" stroke-width="4" fill="none" stroke-dasharray="8 6"/><g font-family="Arial" font-size="14" text-anchor="middle"><circle cx="285" cy="63" r="17" fill="#0a4439"/><text x="285" y="68" fill="white">A</text><circle cx="244" cy="73" r="17" fill="#087960"/><text x="244" y="78" fill="white">N</text><circle cx="175" cy="103" r="17" fill="#ae761c"/><text x="175" y="108" fill="white">B</text><circle cx="80" cy="194" r="17" fill="#849287" stroke="#4e6453" stroke-dasharray="3 3"/><text x="80" y="199" fill="white">R</text><text x="90" y="155">Last known</text></g></svg><figcaption>Diagram simulasi · bukan peta navigasi</figcaption></figure>`;}
function render(){let c='';switch(s.page){
case 'home':c=h('MVR-0 / PILIH PERAN','Mulai perjalanan uji')+`<p class="muted">Pilih peran untuk menjalankan skenario touring.</p><div class="card hero"><h3>${escape(s.tour)}</h3><p>5 peserta · Minggu, 20 September<br>Ardi memimpin · Nia sebagai Sweeper</p></div>`+b('Rider — buka undangan','role:Rider')+b('Sweeper — buka undangan','role:Sweeper','secondary')+b('Leader — buat Tour','role:Leader','secondary');break;
case 'create':c=back('home')+h('LEADER','Buat Tour')+`<form id="create"><label>Judul<input name="tour" required maxlength="70" value="${escape(s.tour)}"></label><label>Jadwal<input name="date" type="datetime-local" required value="${escape(s.date)}"></label><label>Titik kumpul demo<input name="start" required value="${escape(s.start)}"></label><label>Titik berhenti<input name="point" required value="${escape(s.point)}"></label><label>Briefing<textarea name="brief" required>${escape(s.brief)}</textarea></label><p class="muted">Gunakan data fiktif. Sweeper demo: Nia.</p><button>Review Tour</button></form>`;break;
case 'review':c=back('create')+h('REVIEW',escape(s.tour))+`<div class="card"><p>${escape(s.date.replace('T',' · '))}</p><p>${escape(s.start)} → ${escape(s.point)}</p><p>${escape(s.brief)}</p><p>Sweeper: Nia</p></div>`+b('Publish Tour','publish');break;
case 'tour':c=back('home')+h(s.role.toUpperCase(),escape(s.tour))+`<div class="card"><b>${escape(s.date.replace('T',' · '))}</b><p>${escape(s.start)} → ${escape(s.point)}</p><p>Leader: ${s.role==='Leader'?'Anda':'Ardi'} · Sweeper: Nia</p><span class="pill">${s.joined?'Joined':'Published'}</span></div>`+b('Baca touring briefing','go:brief','secondary')+(s.role==='Leader'?b('Undang peserta (simulasi)','go:invite')+b('Mulai Active Ride','go:permission'):s.joined?b('Bergabung Active Ride','go:permission'):`<button data-a="join" ${s.read?'':'disabled'}>Join Tour</button><p class="muted">Baca briefing sebelum bergabung.</p>`);break;
case 'invite':c=back()+h('UNDANGAN','Peserta demo')+`<p>Undangan disimulasikan. Tidak ada pesan yang dikirim.</p><div class="card">Nia · Bima · Raka · Sari</div>`+b('Selesai','go:tour');break;
case 'brief':c=back(s.active?'map':'tour')+h('TOURING BRIEFING','Sebelum berangkat')+`<p>${escape(s.brief)}</p><div class="notice">Operasikan saat berhenti. Posisi dapat terlambat. SOS meminta perhatian grup tanpa jaminan respons.</div><p>Join Tour belum memulai location sharing.</p>`+b('Sudah membaca','read');break;
case 'joined':c=h('JOINED','Anda bergabung Tour')+`<p>Lokasi belum dibagikan. Sharing dimulai setelah Anda memilihnya saat bergabung Active Ride.</p>`+b('Lihat Tour','go:tour');break;
case 'permission':c=back()+h('ACTIVE RIDE','Atur berbagi lokasi')+`<p>Lokasi dibagikan kepada peserta yang berwenang dalam Active Ride ini. Anda dapat berhenti berbagi kapan saja.</p><p class="muted">Izin sistem hanya simulasi.</p>`+b('Izinkan sharing simulasi','share:Sharing')+b('Tolak izin lokasi','share:Permission needed','secondary')+b('Lanjut tanpa sharing','share:Not sharing','secondary');break;
case 'map':c=h(s.role.toUpperCase()+' / COMMAND CENTER',s.health)+`<span class="pill">Anda: ${escape(s.sharing)}</span><p class="muted">3 Fresh/Aging · 1 stale · 1 tidak tersedia</p>`+map()+`<div class="notice">Raka: lokasi terakhir 12 menit lalu. Tidak termasuk spread terkini.</div>`+b('Anggota & attention','go:health','secondary')+b('Pengaturan sharing','go:sharing','secondary')+(s.role==='Leader'?b('Mulai regroup','go:regroup'):b('Instruksi regroup dari Leader','incoming'))+b('Minta perhatian grup (SOS)','go:sos','danger')+b('Touring briefing','go:brief','secondary')+b(s.role==='Leader'?'Akhiri ride':'Simulasikan Leader mengakhiri ride','go:end','secondary');break;
case 'health':c=back('map')+h('CONVOY HEALTH',s.health)+`<p>${{'Connected':'Data demo cukup dan spread berada dalam band pilot.','Watch':'Freshness dan spread perlu perhatian.','Split':'Spread demo melampaui band split.','Data limited':'Data tidak cukup untuk menentukan spread.'}[s.health]} Ini bukan skor keselamatan.</p>`+riders.map(p=>b(`${p[0]} · ${p[1]} · ${p[2]}`,`person:${p[0]}`,'secondary')).join('')+`<label>Skenario moderator<select id="health">${['Connected','Watch','Split','Data limited'].map(x=>`<option ${x===s.health?'selected':''}>${x}</option>`).join('')}</select></label>`;break;
case 'person':{const p=riders.find(x=>x[0]===s.person);c=back('health')+h('RIDER DETAIL',p[0])+`<div class="card"><b>${p[1]}</b><p>${p[2]}</p><p>${p[1]==='Stale'?'Lokasi terakhir diketahui; bukan posisi live.':p[1]==='Unavailable'?'Tidak ada posisi yang dapat ditampilkan.':p[1]==='Aging'?'Posisi mulai menua; periksa waktu pembaruan.':'Lokasi baru diterima dalam simulasi.'}</p></div>`;break;}
case 'sharing':c=back('map')+h('LOCATION SHARING',s.sharing)+`<p>Offline queued hanya terlihat oleh Anda. Peserta lain melihat pembaruan terakhir yang telah dikonfirmasi.</p>`+['Sharing','Not sharing','Permission needed','Offline queued'].map(x=>b(x,`share:${x}`,'secondary')).join('');break;
case 'regroup':c=back('map')+h('REGROUP','Tentukan titik kumpul')+`<p>${escape(s.point)}</p><p>Instruksi koordinasi, bukan panduan navigasi.</p>`+b('Konfirmasi kirim regroup','sendregroup');break;
case 'regroupStatus':c=back('map')+h('REGROUP',escape(s.point))+`<div class="card"><div class="row">Nia <b>Acknowledged</b></div><div class="row">Bima <b>Delivered</b></div><div class="row">Raka <b>Pending</b></div><div class="row">Anda <b>${s.ack?'Acknowledged':'Belum konfirmasi'}</b></div></div><p class="muted">Delivered berarti pesan sampai. Pending belum terkonfirmasi. Acknowledged bukan jaminan peserta sudah tiba.</p>`+(s.role==='Leader'?'':b(s.ack?'Sudah dikonfirmasi':'Saya memahami instruksi','ack'));break;
case 'sos':c=back('map')+h('CONTROLLED SOS','Minta perhatian grup')+`<div class="notice">MotoVue bukan layanan darurat dan tidak menjamin respons. Tidak ada layanan darurat yang dihubungi.</div><label>Konteks demo<select><option>Masalah motor</option><option>Perlu bantuan grup</option></select></label>`+b('Konfirmasi kirim SOS simulasi','sendsos','danger')+b('Batal','go:map','secondary');break;
case 'sosStatus':c=back('map')+h('SOS STATUS',s.sos)+`<p>${s.sos==='Acknowledged'?'Nia mengakui pesan dalam simulasi. Ini tidak menjamin bantuan tiba.':s.sos==='Failed'?'Pengiriman gagal. Grup belum menerima permintaan ini.':s.sos==='Cancelled'?'Permintaan dibatalkan dalam simulasi.':'Belum ada konfirmasi respons grup.'}</p>`+(s.sos==='Failed'?b('Coba kirim lagi','sendsos'):s.sos==='Cancelled'?'':b('Batalkan permintaan','cancelsos','secondary'))+`<label>Skenario moderator<select id="sosState">${['Pending','Sent','Acknowledged','Failed','Cancelled'].map(x=>`<option ${x===s.sos?'selected':''}>${x}</option>`).join('')}</select></label>`;break;
case 'end':c=back('map')+h('END RIDE','Akhiri perjalanan?')+`<p>Location sharing dihentikan. Ringkasan demo akan tersedia.</p>`+b('Konfirmasi selesai','finish');break;
case 'memory':c=h('RIDE MEMORY',escape(s.tour))+`<div class="card hero"><div class="metric">4 jam 12 menit</div><p>5 peserta · Perjalanan demo selesai</p></div><p>Sharing berhenti. Ringkasan menggunakan data fiktif.</p>`+b('Buat Ride Card','go:privacy')+b('Kembali ke awal','reset','secondary');break;
case 'privacy':c=back('memory')+h('RIDE CARD','Tinjau sebelum dibagikan')+`<p>Lokasi presisi, titik rumah, dan lokasi live tidak disertakan.</p><label><input type="checkbox" id="route" ${s.route?'checked':''}>Tampilkan nama area demo</label><label><input type="checkbox" id="names" ${s.names?'checked':''}>Tampilkan nama peserta fiktif</label>`+b('Buat kartu demo','go:card');break;
case 'card':c=back('privacy')+h('RIDE CARD','Kenangan perjalanan')+`<div class="card hero"><b>MOTOVUE / DEMO</b><h2>${escape(s.tour)}</h2><p>5 peserta · 4 jam 12 menit</p>${s.route?'<p>Area Puncak — simulasi</p>':''}${s.names?'<p>Ardi, Nia, Bima, Raka, Sari</p>':''}<p>Tanpa lokasi presisi</p></div><p class="muted">Preview saja; tidak dikirim ke media sosial.</p>`+b('Selesai','go:memory');break;
}root.innerHTML=c;}
function act(a){if(a==='reset')s=init();else if(a.startsWith('role:')){s=init();s.role=a.slice(5);s.page=s.role==='Leader'?'create':'tour';}else if(a.startsWith('go:'))s.page=a.slice(3);else if(a.startsWith('share:')){s.sharing=a.slice(6);s.active=true;s.page='map';}else if(a.startsWith('person:')){s.person=a.slice(7);s.page='person';}else if(a==='read'){s.read=true;s.page=s.active?'map':'tour';}else if(a==='join'&&s.read){s.joined=true;s.page='joined';}else if(a==='publish'){s.joined=true;s.page='tour';}else if(a==='sendregroup'||a==='incoming'){s.page='regroupStatus';}else if(a==='ack')s.ack=true;else if(a==='sendsos'){s.sos='Pending';s.page='sosStatus';}else if(a==='cancelsos')s.sos='Cancelled';else if(a==='finish'){s.sharing='Not sharing';s.active=false;s.page='memory';}render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled)act(el.dataset.a)});
document.addEventListener('submit',e=>{if(e.target.id==='create'){e.preventDefault();const d=new FormData(e.target);for(const k of ['tour','date','start','point','brief'])s[k]=String(d.get(k)).trim();s.page='review';render();}});
document.addEventListener('change',e=>{if(e.target.id==='health'){s.health=e.target.value;render();}if(e.target.id==='sosState'){s.sos=e.target.value;render();}if(e.target.id==='route')s.route=e.target.checked;if(e.target.id==='names')s.names=e.target.checked;});
if(document.modelContext?.registerTool)Promise.resolve(document.modelContext.registerTool({name:'read_prototype_state',description:'Read the current MotoVue demo screen, role, and sharing state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({screen:s.page,role:s.role,sharing:s.sharing,sos:s.sos})})).catch(()=>{});
render();
</script></body></html>
