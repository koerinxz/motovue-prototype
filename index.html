<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoVue — Prototype MVR-0</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a4439'/%3E%3Cpath d='M6 23V9l10 10L26 9v14' fill='none' stroke='%23c6f36b' stroke-width='3'/%3E%3C/svg%3E"><style>:root{font:16px Arial,sans-serif;color:#17372e;background:#e9efeb}*{box-sizing:border-box}body{margin:0;display:flex;justify-content:center;gap:7vw;padding:40px 24px}aside{max-width:360px;padding-top:70px}.brand{font-size:34px}aside h1{font-size:48px;line-height:1.1;letter-spacing:-2px;margin-top:70px}aside p{line-height:1.7;color:#536c62}.meta{margin-top:90px;font-size:13px;letter-spacing:1px}main{width:440px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #123c241a}header{padding:20px 24px;display:flex;align-items:center;justify-content:space-between}header b{font-size:22px}.ribbon{padding:10px 24px;background:#d7eaa9;font-size:12px;letter-spacing:1px;font-weight:bold}article{padding:24px;min-height:550px}h2{font-size:28px;letter-spacing:-1px;margin:10px 0 16px}h3{font-size:18px}p{line-height:1.55}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#607568}.muted{color:#607568;font-size:14px}.card{border:1px solid #dce5de;padding:18px;border-radius:16px;margin:16px 0}.hero{background:#0a4439;color:#fff;border:0}.hero p{color:#dbebdd}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e8eee9}.pill{font-size:14px;border-radius:7px;padding:5px 8px;background:#eff3ed}.notice{padding:14px;background:#fff0d6;border-radius:12px;font-size:14px;line-height:1.6}button{cursor:pointer;width:100%;padding:15px;border:0;background:#0a4439;color:white;border-radius:11px;font:700 16px Arial;margin:6px 0}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79a94e;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf3ed;color:#234f3e}.danger{background:#a33627}.small{width:auto;padding:9px 12px;font-size:14px}label{display:block;line-height:1.5;margin:14px 0}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:13px;border:1px solid #bccfc4;border-radius:9px;font:inherit;margin-top:6px}input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin-right:7px}.map{background:#e5eee5;border-radius:16px;overflow:hidden;margin:16px 0}.map svg{display:block;width:100%}.map figcaption{font-size:12px;padding:10px;color:#546e5d}.metric{font-size:32px;font-weight:700}.back{width:auto;padding:0;margin:0 0 18px;background:none;color:#345b48;font-size:14px}footer{padding:20px 24px;font-size:12px;color:#6e7e73;line-height:1.6;border-top:1px solid #e9eee9}@media(max-width:800px){body{padding:0}aside{display:none}main{width:100%;max-width:480px;min-height:100vh;border-radius:0;box-shadow:none}}
</style></head><body><aside><b class="brand">MotoVue.</b><h1>See the ride.<br>Own the journey.</h1><p>Koordinasi touring dalam satu pandangan.</p><p class="meta">MVR-0 / INTERACTIVE PROTOTYPE<br>Rider · Leader · Sweeper</p></aside><main><header><b>MotoVue</b><button class="small secondary" data-a="reset">Ulang sesi</button></header><div class="ribbon">SIMULASI · gunakan saat berhenti</div><article id="app"></article><footer>Semua data fiktif. Tidak ada lokasi live, pesan eksternal, atau layanan darurat.</footer></main><script>const root=document.getElementById('app');
const init=()=>({page:'home',role:'Rider',joined:false,read:false,sharing:'Not sharing',health:'Watch',tour:'Weekend Puncak Loop',brief:'Berhenti di titik regroup yang disepakati. Periksa anggota grup sebelum berangkat.',date:'2026-09-20T06:00',start:'Titik kumpul demo',point:'Rest Area Cisarua',ack:false,regroup:null,sos:'',sosContext:'Masalah motor',sentContext:'',moderatorOpen:false,person:'Ardi',route:false,names:false});let s=init();
const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(t,a,css='')=>`<button class="${css}" data-a="${a}">${t}</button>`;const back=(p='tour')=>b('← Kembali',`go:${p}`,'back');const h=(a,t)=>`<div class="eyebrow">${a}</div><h2>${t}</h2>`;
const moderatorEnabled=new URLSearchParams(location.search).get('moderator')==='1';
const identities={Rider:'Bima',Leader:'Ardi',Sweeper:'Nia'};
const self=()=>identities[s.role];
const label=name=>name===self()?name+' (Anda)':name;
const scenarios={
  Connected:[['Ardi','Fresh',10,0],['Nia','Fresh',20,.2],['Bima','Fresh',15,.4],['Raka','Fresh',25,.6],['Sari','Fresh',30,.8]],
  Watch:[['Ardi','Fresh',10,0],['Nia','Fresh',20,.4],['Bima','Aging',120,1.5],['Raka','Stale',720,4],['Sari','Unavailable',null,null]],
  Split:[['Ardi','Fresh',10,0],['Nia','Fresh',20,5],['Bima','Aging',120,2.5],['Raka','Stale',720,6],['Sari','Unavailable',null,null]],
  'Data limited':[['Ardi','Stale',720,0],['Nia','Stale',900,2],['Bima','Stale',800,4],['Raka','Stale',960,6],['Sari','Unavailable',null,null]]
};
function members(){
  return scenarios[s.health].map(([name,status,age,km])=>{
    if(name===self()){
      if(s.sharing==='Not sharing'||s.sharing==='Permission needed')return {name,status:'Unavailable',age:null,km:null,reason:s.sharing==='Permission needed'?'Izin lokasi belum diberikan; Anda tidak tampil sebagai peserta live.':'Anda tidak berbagi lokasi.'};
      if(s.sharing==='Offline queued')return {name,status:'Stale',age:720,km,reason:'Update lokal belum dikonfirmasi server. Ini posisi terakhir yang terlihat oleh grup.'};
      if(s.sharing==='Sharing')return {name,status:s.health==='Data limited'?'Fresh':status==='Stale'?'Fresh':status,age:s.health==='Data limited'||status==='Stale'?10:age,km};
    }
    return {name,status,age,km,reason:status==='Unavailable'?'Belum ada lokasi yang dibagikan.':''};
  });
}
const ageText=p=>p.age===null?'Belum ada posisi':p.age<60?p.age+' detik lalu':Math.floor(p.age/60)+' menit lalu';
function convoy(){
  const rows=members(),eligible=rows.filter(p=>['Fresh','Aging'].includes(p.status)&&p.km!==null);
  const spread=eligible.length<2?null:Math.max(...eligible.map(p=>p.km))-Math.min(...eligible.map(p=>p.km));
  const status=spread===null?'Data limited':spread>=3?'Split':spread>=1||rows.some(p=>p.status!=='Fresh')?'Watch':'Connected';
  const reason=spread===null?'Posisi Fresh/Aging kurang dari dua. Spread tidak dapat dihitung.':status==='Split'?'Spread melampaui band split demo (3 km).':status==='Watch'?'Spread atau freshness anggota perlu perhatian.':'Semua posisi fresh dan spread di bawah band watch demo (1 km).';
  return {rows,eligible,spread,status,reason};
}
function map(){
  const dots=members().filter(p=>p.km!==null).map(p=>{
    const x=35+p.km/6*285,y=75;
    return '<g><circle cx="'+x+'" cy="'+y+'" r="15" fill="'+(p.status==='Stale'?'#87948b':p.status==='Aging'?'#946117':'#0a4439')+'"'+(p.status==='Stale'?' stroke="#51685b" stroke-dasharray="3 3"':'')+'/>'+(p.name===self()?'<circle cx="'+x+'" cy="'+y+'" r="20" stroke="#153d2d" fill="none"/>':'')+'<text x="'+x+'" y="'+(y+5)+'" fill="white" text-anchor="middle">'+p.name[0]+'</text></g>';
  }).join('');
  return '<figure class="map"><svg viewBox="0 0 360 150" role="img" aria-label="Diagram posisi demo. Detail nama, freshness, dan waktu tersedia pada daftar di bawah."><path d="M20 75H340" stroke="#bfd0c1" stroke-width="30"/><path d="M20 75H340" stroke="white" stroke-width="3" stroke-dasharray="8 6"/>'+dots+'<text x="24" y="130" font-size="12" fill="#345b48">Lingkaran luar: Anda · putus-putus: last known</text></svg><figcaption>Diagram jarak demo, bukan peta navigasi. Titik berdekatan dapat bertumpuk.</figcaption></figure>';
}
function memberButtons(){return members().map(p=>b(label(p.name)+' · '+p.status+' · '+ageText(p),'person:'+p.name,'secondary')).join('');}
function summary(){
  const g=convoy(),me=g.rows.find(p=>p.name===self());
  return '<div class="card"><b>'+escape(label(self()))+' · '+escape(s.sharing)+'</b><p>'+me.status+' · '+ageText(me)+'</p>'+(me.reason?'<p class="muted">'+me.reason+'</p>':'')+'</div><p class="muted">'+g.eligible.length+' posisi Fresh/Aging · '+g.rows.filter(p=>p.status==='Stale').length+' stale · '+g.rows.filter(p=>p.status==='Unavailable').length+' tidak tersedia</p><p><b>Spread demo: '+(g.spread===null?'tidak tersedia':g.spread.toFixed(1)+' km')+'</b></p><p class="muted">'+g.reason+' Posisi stale tidak ikut dihitung. Bukan skor keselamatan.</p>';
}
function moderatorPanel(){
  if(!moderatorEnabled)return '';
  if(!s.moderatorOpen)return b('Panel moderator','moderator','secondary small');
  const options=(values,current)=>values.map(x=>'<option '+(x===current?'selected':'')+'>'+x+'</option>').join('');
  return '<section class="card moderator"><h3>Panel moderator</h3><p class="muted">Hanya mengatur sesi pada perangkat ini. Tutup panel sebelum peserta melanjutkan.</p><label>Skenario konvoi<select id="health">'+options(Object.keys(scenarios),s.health)+'</select></label><label>Simulasi status pribadi<select id="mockSharing">'+options(['Sharing','Not sharing','Permission needed','Offline queued'],s.sharing)+'</select></label>'+b('Terima regroup dari Leader','incoming','secondary')+(s.sos?'<label>Status SOS<select id="sosState">'+options(['Pending','Sent','Acknowledged','Failed','Cancelled'],s.sos)+'</select></label>':'')+b('Kembali ke peserta','moderator')+'</section>';
}
function render(){let c='';switch(s.page){
case 'home':c=h('MVR-0 / PILIH PERAN','Mulai perjalanan uji')+`<p class="muted">Pilih peran untuk menjalankan skenario touring.</p><div class="card hero"><h3>${escape(s.tour)}</h3><p>5 peserta · Minggu, 20 September<br>Ardi memimpin · Nia sebagai Sweeper</p></div>`+b('Rider — buka undangan','role:Rider')+b('Sweeper — buka undangan','role:Sweeper','secondary')+b('Leader — buat Tour','role:Leader','secondary');break;
case 'create':c=back('home')+h('LEADER','Buat Tour')+`<form id="create"><label>Judul<input name="tour" required maxlength="70" value="${escape(s.tour)}"></label><label>Jadwal<input name="date" type="datetime-local" required value="${escape(s.date)}"></label><label>Titik kumpul demo<input name="start" required value="${escape(s.start)}"></label><label>Titik berhenti<input name="point" required value="${escape(s.point)}"></label><label>Briefing<textarea name="brief" required>${escape(s.brief)}</textarea></label><p class="muted">Gunakan data fiktif. Sweeper demo: Nia.</p><button>Review Tour</button></form>`;break;
case 'review':c=back('create')+h('REVIEW',escape(s.tour))+`<div class="card"><p>${escape(s.date.replace('T',' · '))}</p><p>${escape(s.start)} → ${escape(s.point)}</p><p>${escape(s.brief)}</p><p>Sweeper: Nia</p></div>`+b('Publish Tour','publish');break;
case 'tour':c=back('home')+h(s.role.toUpperCase(),escape(s.tour))+`<div class="card"><b>${escape(s.date.replace('T',' · '))}</b><p>${escape(s.start)} → ${escape(s.point)}</p><p>Leader: ${s.role==='Leader'?'Anda':'Ardi'} · Sweeper: Nia</p><span class="pill">${s.joined?'Joined':'Published'}</span></div>`+b('Baca touring briefing','go:brief','secondary')+(s.role==='Leader'?b('Undang peserta (simulasi)','go:invite')+b('Mulai Active Ride','go:permission'):s.joined?b('Bergabung Active Ride','go:permission'):`<button data-a="join" ${s.read?'':'disabled'}>Join Tour</button><p class="muted">Baca briefing sebelum bergabung.</p>`);break;
case 'invite':c=back()+h('UNDANGAN','Peserta demo')+`<p>Undangan disimulasikan. Tidak ada pesan yang dikirim.</p><div class="card">Nia · Bima · Raka · Sari</div>`+b('Selesai','go:tour');break;
case 'brief':c=back(s.active?'map':'tour')+h('TOURING BRIEFING','Sebelum berangkat')+`<p>${escape(s.brief)}</p><div class="notice">Operasikan saat berhenti. Posisi dapat terlambat. SOS meminta perhatian grup tanpa jaminan respons.</div><p>Join Tour belum memulai location sharing.</p>`+b('Sudah membaca','read');break;
case 'joined':c=h('JOINED','Anda bergabung Tour')+`<p>Lokasi belum dibagikan. Sharing dimulai setelah Anda memilihnya saat bergabung Active Ride.</p>`+b('Lihat Tour','go:tour');break;
case 'permission':c=back()+h('ACTIVE RIDE','Atur berbagi lokasi')+`<p>Lokasi dibagikan kepada peserta yang berwenang dalam Active Ride ini. Anda dapat berhenti berbagi kapan saja.</p><p class="muted">Izin sistem hanya simulasi.</p>`+b('Izinkan sharing simulasi','share:Sharing')+b('Tolak izin lokasi','share:Permission needed','secondary')+b('Lanjut tanpa sharing','share:Not sharing','secondary');break;
case 'map':c=h(s.role.toUpperCase()+' / COMMAND CENTER',convoy().status)+(s.sos?'<div class="notice"><b>SOS '+escape(s.sos)+'</b><p>'+escape(s.sentContext)+'</p>'+b('Lihat status SOS','go:sosStatus','danger')+'</div>':'')+(s.regroup?'<div class="notice"><b>Regroup: '+escape(s.regroup.point)+'</b>'+b('Lihat instruksi regroup','go:regroupStatus','secondary')+'</div>':'')+summary()+map()+memberButtons()+b('Anggota & attention','go:health','secondary')+b('Pengaturan sharing','go:sharing','secondary')+(s.role==='Leader'?b(s.regroup?'Ubah titik regroup':'Mulai regroup','go:regroup'):s.regroup?'':'<p class="muted">Belum ada instruksi regroup dari Leader.</p>')+(s.sos&&s.sos!=='Cancelled'?'':b('Minta perhatian grup (SOS)','go:sos','danger'))+b('Touring briefing','go:brief','secondary')+b(s.role==='Leader'?'Akhiri ride':'Simulasikan Leader mengakhiri ride','go:end','secondary');break;
case 'health':c=back('map')+h('CONVOY HEALTH',convoy().status)+summary()+memberButtons();break;
case 'person':{const p=members().find(x=>x.name===s.person);c=back('map')+h('RIDER DETAIL',label(p.name))+'<div class="card"><b>'+p.status+'</b><p>'+ageText(p)+'</p><p>'+(p.reason||(p.status==='Stale'?'Lokasi terakhir diketahui; bukan posisi live.':p.status==='Aging'?'Posisi mulai menua; periksa waktu pembaruan.':'Lokasi baru diterima dalam simulasi.'))+'</p></div>';break;}
case 'sharing':c=back('map')+h('LOCATION SHARING',s.sharing)+'<p>Lokasi dibagikan hanya selama Active Ride ini. Menolak izin berarti Anda tidak tampil sebagai peserta live.</p>'+b('Izinkan sharing simulasi','share:Sharing')+b('Berhenti berbagi lokasi','share:Not sharing','secondary')+b('Tolak izin lokasi','share:Permission needed','secondary');break;
case 'regroup':c=back('map')+h('REGROUP','Tentukan titik kumpul')+'<form id="regroup"><label>Titik kumpul demo<select name="regroupPoint">'+[...new Set([s.point,'Warung Kopi Demo','Pos Istirahat Demo'])].map(x=>'<option '+(x===(s.regroup?.point||s.point)?'selected':'')+'>'+escape(x)+'</option>').join('')+'</select></label><p>Instruksi koordinasi, bukan panduan navigasi. Mengubah titik akan meminta konfirmasi baru dari peserta.</p><button>Konfirmasi kirim regroup</button></form>';break;
case 'regroupStatus':c=back('map')+h('REGROUP',escape(s.regroup?.point||s.point))+(s.regroup?'<div class="card">'+members().map(p=>'<div class="row"><span>'+label(p.name)+'</span><b>'+s.regroup.statuses[p.name]+'</b></div>').join('')+'</div>':'<p>Belum ada instruksi regroup.</p>')+'<p class="muted">Sent: sudah dikirim, belum ada bukti sampai. Delivered: sudah sampai. Acknowledged: peserta mengonfirmasi, bukan jaminan tiba. Pending: pengiriman belum terkonfirmasi.</p>'+(s.regroup&&s.role!=='Leader'?(s.regroup.statuses[self()]==='Acknowledged'?'<p>Anda sudah mengonfirmasi instruksi ini.</p>':b('Saya memahami instruksi','ack')):'');break;
case 'sos':c=back('map')+h('CONTROLLED SOS','Minta perhatian grup')+'<div class="notice">MotoVue bukan layanan darurat dan tidak menjamin respons. Tidak ada layanan darurat yang dihubungi.</div><form id="sos"><label>Konteks demo<select name="context">'+['Masalah motor','Perlu bantuan grup'].map(x=>'<option '+(x===s.sosContext?'selected':'')+'>'+x+'</option>').join('')+'</select></label><button class="danger">Tinjau permintaan</button></form>'+b('Batal','go:map','secondary');break;
case 'sosStatus':c=back('map')+h('SOS STATUS',s.sos)+'<div class="card"><b>Konteks: '+escape(s.sentContext)+'</b><p>Pengirim: '+label(self())+'</p></div><p>'+({'Acknowledged':(self()==='Nia'?'Ardi':'Nia')+' mengakui pesan dalam simulasi. Ini tidak menjamin bantuan tiba.','Failed':'Pengiriman gagal. Grup belum menerima permintaan ini.','Cancelled':'Permintaan dibatalkan dalam simulasi.','Pending':'Pengiriman belum terkonfirmasi. Belum ada bukti pesan diterima grup.','Sent':'Permintaan sudah dikirim; penerimaan dan respons grup belum dikonfirmasi.'}[s.sos]||'Belum ada permintaan.')+'</p>'+(s.sos==='Failed'?b('Coba kirim lagi','retrySOS'):s.sos==='Cancelled'?'':b('Batalkan permintaan','go:cancelSOS','secondary'));break;
case 'sosConfirm':c=back('sos')+h('KONFIRMASI SOS','Kirim ke grup?')+'<div class="card"><b>'+escape(s.sosContext)+'</b><p>Permintaan perhatian akan disimulasikan kepada peserta Tour.</p></div>'+b('Konfirmasi kirim SOS simulasi','sendsos','danger')+b('Batal','go:map','secondary');break;
case 'cancelSOS':c=back('sosStatus')+h('BATALKAN SOS','Batalkan permintaan ini?')+'<p>'+escape(s.sentContext)+'</p>'+b('Ya, batalkan','cancelsos','danger')+b('Tetap aktif','go:sosStatus','secondary');break;
case 'end':c=back('map')+h('END RIDE','Akhiri perjalanan?')+`<p>Location sharing dihentikan. Ringkasan demo akan tersedia.</p>`+b('Konfirmasi selesai','finish');break;
case 'memory':c=h('RIDE MEMORY',escape(s.tour))+`<div class="card hero"><div class="metric">4 jam 12 menit</div><p>5 peserta · Perjalanan demo selesai</p></div><p>Sharing berhenti. Ringkasan menggunakan data fiktif.</p>`+b('Buat Ride Card','go:privacy')+b('Kembali ke awal','reset','secondary');break;
case 'privacy':c=back('memory')+h('RIDE CARD','Tinjau sebelum dibagikan')+`<p>Lokasi presisi, titik rumah, dan lokasi live tidak disertakan.</p><label><input type="checkbox" id="route" ${s.route?'checked':''}>Tampilkan nama area demo</label><label><input type="checkbox" id="names" ${s.names?'checked':''}>Tampilkan nama peserta fiktif</label>`+b('Buat kartu demo','go:card');break;
case 'card':c=back('privacy')+h('RIDE CARD','Kenangan perjalanan')+`<div class="card hero"><b>MOTOVUE / DEMO</b><h2>${escape(s.tour)}</h2><p>5 peserta · 4 jam 12 menit</p>${s.route?'<p>Area Puncak — simulasi</p>':''}${s.names?'<p>Ardi, Nia, Bima, Raka, Sari</p>':''}<p>Tanpa lokasi presisi</p></div><p class="muted">Preview saja; tidak dikirim ke media sosial.</p>`+b('Selesai','go:memory');break;
}root.innerHTML=c+moderatorPanel();}
function receiveRegroup(point){s.regroup={point,statuses:{Ardi:'Acknowledged',Nia:'Acknowledged',Bima:'Delivered',Raka:'Pending',Sari:'Sent'}};if(s.role!=='Leader')s.regroup.statuses[self()]='Delivered';s.health='Split';}
function act(a){
 if(a==='reset')s=init();
 else if(a==='moderator'&&moderatorEnabled)s.moderatorOpen=!s.moderatorOpen;
 else if(a.startsWith('role:')){s=init();s.role=a.slice(5);s.page=s.role==='Leader'?'create':'tour';}
 else if(a.startsWith('go:')){const target=a.slice(3);if(target==='regroup'&&s.role!=='Leader')return;s.page=target;}
 else if(a.startsWith('share:')){s.sharing=a.slice(6);s.active=true;s.page='map';}
 else if(a.startsWith('person:')){s.person=a.slice(7);s.page='person';}
 else if(a==='read'){s.read=true;s.page=s.active?'map':'tour';}
 else if(a==='join'&&s.read){s.joined=true;s.page='joined';}
 else if(a==='publish'){s.joined=true;s.page='tour';}
 else if(a==='incoming'&&moderatorEnabled){receiveRegroup(s.point);s.moderatorOpen=false;s.page='map';}
 else if(a==='ack'&&s.regroup){s.regroup.statuses[self()]='Acknowledged';}
 else if(a==='sendsos'){s.sentContext=s.sosContext;s.sos='Pending';s.page='sosStatus';}
 else if(a==='retrySOS'){s.sos='Pending';s.page='sosStatus';}
 else if(a==='cancelsos'){s.sos='Cancelled';s.page='sosStatus';}
 else if(a==='finish'){s.sharing='Not sharing';s.active=false;s.page='memory';}
 render();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled)act(el.dataset.a)});
document.addEventListener('submit',e=>{
 e.preventDefault();const d=new FormData(e.target);
 if(e.target.id==='create'){for(const k of ['tour','date','start','point','brief'])s[k]=String(d.get(k)).trim();if(['tour','date','start','point','brief'].some(k=>!s[k])){e.target.reportValidity();return;}s.page='review';}
 if(e.target.id==='regroup'&&s.role==='Leader'){receiveRegroup(String(d.get('regroupPoint')));s.page='regroupStatus';}
 if(e.target.id==='sos'){s.sosContext=String(d.get('context'));s.page='sosConfirm';}
 render();
});
document.addEventListener('change',e=>{
 if(moderatorEnabled&&e.target.id==='health'){s.health=e.target.value;render();}
 if(moderatorEnabled&&e.target.id==='sosState'){s.sos=e.target.value;render();}
 if(moderatorEnabled&&e.target.id==='mockSharing'){s.sharing=e.target.value;render();}
 if(e.target.id==='route')s.route=e.target.checked;
 if(e.target.id==='names')s.names=e.target.checked;
});
